<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MicroPlasma CAM - 2D Web Plasma CAM</title>
  <link rel="stylesheet" href="/src/styles/index.css" />
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="logo-group">
      <div class="logo-badge">⚡ PLASMA</div>
      <span class="app-title">MicroPlasma CAM</span>
    </div>

    <div class="header-actions">
      <!-- Material Preset Selector -->
      <select id="presetSelect" class="preset-select" title="Select Material Preset">
        <!-- populated dynamically -->
      </select>

      <!-- Sample Loader Dropdown -->
      <select id="sampleSelect" class="preset-select" title="Load Sample CAD Part">
        <option value="">📁 Load Sample Part...</option>
        <option value="flange-bracket">4-Bolt Flange Plate</option>
        <option value="gusset-bracket">Gusset with Slots</option>
        <option value="slot-link">Pill Slot Link</option>
      </select>

      <!-- Upload DXF File Button -->
      <input type="file" id="dxfFileInput" accept=".dxf" style="display: none;" />
      <button id="btnUploadDxf" class="btn btn-secondary" title="Open DXF File">
        <span>📂 Upload DXF</span>
      </button>

      <!-- Export G-Code Button -->
      <button id="btnExportGCode" class="btn btn-primary" title="Export GRBL G-Code (.nc)">
        <span>⚡ Export .nc</span>
      </button>

      <!-- Sidebar Toggle (Mobile) -->
      <button id="btnToggleSidebar" class="btn btn-secondary" title="Toggle Parameters">
        <span>⚙️</span>
      </button>
    </div>
  </header>

  <!-- Main CAM Work Area -->
  <main class="main-container">
    <!-- Viewport -->
    <div class="viewport-area" id="dropZone">
      <canvas id="camViewport"></canvas>

      <!-- Top Overlay Controls -->
      <div class="viewport-overlay-top">
        <button id="btnZoomFit" class="btn btn-secondary" title="Zoom to Fit">
          <span>🔍 Fit</span>
        </button>
      </div>

      <!-- Toolpath Legend Bar -->
      <div class="legend-bar">
        <div class="legend-item"><span class="legend-dot cad"></span> CAD Raw</div>
        <div class="legend-item"><span class="legend-dot cut"></span> Kerf Cut</div>
        <div class="legend-item"><span class="legend-dot leadin"></span> Lead-in</div>
        <div class="legend-item"><span class="legend-dot overburn"></span> Overburn</div>
        <div class="legend-item"><span class="legend-dot rapid"></span> Rapid G0</div>
        <div class="legend-item"><span class="legend-dot pierce"></span> Pierce</div>
      </div>

      <!-- Bottom Floating Stats Bar -->
      <div class="viewport-overlay-bottom" id="statsBar">
        <div class="stat-item">Cut: <span class="stat-val" id="statCutLength">0.0 mm</span></div>
        <div class="stat-item">Rapid: <span class="stat-val" id="statRapidLength">0.0 mm</span></div>
        <div class="stat-item">Pierces: <span class="stat-val" id="statPierceCount">0</span></div>
        <div class="stat-item">Est. Time: <span class="stat-val" id="statEstTime">0s</span></div>
      </div>
    </div>

    <!-- Right Sidebar / Flyout Parameter Panel -->
    <aside class="sidebar-panel" id="sidebarPanel">
      <!-- Warnings Container -->
      <div id="warningsContainer" style="display: none;" class="warnings-banner"></div>

      <!-- Section: Machine & Material -->
      <div class="panel-section">
        <div class="panel-title">Machine & Material</div>
        <div class="control-row">
          <label class="control-label" for="paramFeedRate">Cut Feed Rate</label>
          <div class="control-input-group">
            <input type="number" id="paramFeedRate" class="input-num" step="50" min="100" max="15000" />
            <span class="input-unit">mm/min</span>
          </div>
        </div>
        <div class="control-row">
          <label class="control-label" for="paramPierceDelay">Pierce Delay</label>
          <div class="control-input-group">
            <input type="number" id="paramPierceDelay" class="input-num" step="0.05" min="0" max="10" />
            <span class="input-unit">sec</span>
          </div>
        </div>
        <div class="control-row">
          <label class="control-label" for="paramKerfWidth">Kerf Width</label>
          <div class="control-input-group">
            <input type="number" id="paramKerfWidth" class="input-num" step="0.1" min="0" max="5.0" />
            <span class="input-unit">mm</span>
          </div>
        </div>
      </div>

      <!-- Section: Lead-In & Lead-Out -->
      <div class="panel-section">
        <div class="panel-title">Lead-In & Lead-Out</div>
        <div class="control-row">
          <label class="control-label">Type</label>
          <div class="radio-pill-group" id="leadInTypeGroup">
            <div class="radio-pill active" data-value="arc">Arc</div>
            <div class="radio-pill" data-value="line">Linear</div>
            <div class="radio-pill" data-value="center_pierce">Center</div>
          </div>
        </div>
        <div class="control-row">
          <label class="control-label" for="paramLeadInRadius">Radius / Length</label>
          <div class="control-input-group">
            <input type="number" id="paramLeadInRadius" class="input-num" step="0.5" min="1.0" max="25" />
            <span class="input-unit">mm</span>
          </div>
        </div>
        <div class="control-row">
          <label class="control-label" for="paramLeadInAngle">Arc Sweep Angle</label>
          <div class="control-input-group">
            <input type="number" id="paramLeadInAngle" class="input-num" step="5" min="30" max="120" />
            <span class="input-unit">deg</span>
          </div>
        </div>
        <div class="control-row">
          <label class="control-label" for="paramLeadOutLength">Lead-Out Length</label>
          <div class="control-input-group">
            <input type="number" id="paramLeadOutLength" class="input-num" step="0.5" min="0" max="10" />
            <span class="input-unit">mm</span>
          </div>
        </div>
      </div>

      <!-- Section: Plasma Hole Rules -->
      <div class="panel-section">
        <div class="panel-title">Plasma Hole Rules</div>
        <div class="control-row">
          <label class="control-label" for="paramOverburn">Overburn Distance</label>
          <div class="control-input-group">
            <input type="number" id="paramOverburn" class="input-num" step="0.5" min="0" max="15" />
            <span class="input-unit">mm</span>
          </div>
        </div>
        <div class="control-row">
          <label class="control-label" for="paramSmallHoleThreshold">Small Hole Cutoff</label>
          <div class="control-input-group">
            <input type="number" id="paramSmallHoleThreshold" class="input-num" step="1" min="5" max="100" />
            <span class="input-unit">mm</span>
          </div>
        </div>
        <div class="control-row">
          <label class="control-label" for="paramSmallHoleSpeedScale">Small Hole Speed</label>
          <div class="control-input-group">
            <input type="number" id="paramSmallHoleSpeedScale" class="input-num" step="5" min="20" max="100" />
            <span class="input-unit">%</span>
          </div>
        </div>
      </div>

      <!-- Section: Datum Origin Alignment -->
      <div class="panel-section">
        <div class="panel-title">
          <span>Datum Origin Alignment</span>
          <span id="currentDatumLabel" style="color: var(--accent-plasma); font-size: 10px;">Bottom-Left</span>
        </div>

        <div style="margin-bottom: 12px;">
          <!-- 9-point grid -->
          <div class="origin-grid" id="originGrid">
            <div class="origin-node" data-datum="TOP_LEFT" title="Top-Left"><div class="origin-node-dot"></div></div>
            <div class="origin-node" data-datum="TOP_CENTER" title="Top-Center"><div class="origin-node-dot"></div></div>
            <div class="origin-node" data-datum="TOP_RIGHT" title="Top-Right"><div class="origin-node-dot"></div></div>
            <div class="origin-node" data-datum="MIDDLE_LEFT" title="Middle-Left"><div class="origin-node-dot"></div></div>
            <div class="origin-node" data-datum="CENTER" title="Center"><div class="origin-node-dot"></div></div>
            <div class="origin-node" data-datum="MIDDLE_RIGHT" title="Middle-Right"><div class="origin-node-dot"></div></div>
            <div class="origin-node active" data-datum="BOTTOM_LEFT" title="Bottom-Left"><div class="origin-node-dot"></div></div>
            <div class="origin-node" data-datum="BOTTOM_CENTER" title="Bottom-Center"><div class="origin-node-dot"></div></div>
            <div class="origin-node" data-datum="BOTTOM_RIGHT" title="Bottom-Right"><div class="origin-node-dot"></div></div>
          </div>
        </div>

        <div class="control-row">
          <label class="control-label" for="cadOriginToggle">Use CAD Origin (0,0)</label>
          <input type="checkbox" id="cadOriginToggle" />
        </div>
      </div>
    </aside>
  </main>

  <!-- G-Code Viewer & Download Modal -->
  <div class="modal-backdrop" id="gcodeModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">⚡ Generated GRBL Plasma G-Code</h3>
        <button id="btnCloseModal" class="btn btn-secondary">✕</button>
      </div>
      <div class="modal-body">
        <textarea id="gcodeContent" class="gcode-textarea" readonly spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button id="btnCopyGCode" class="btn btn-secondary">📋 Copy G-Code</button>
        <button id="btnDownloadModal" class="btn btn-primary">💾 Download .nc File</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
